<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>control-app Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; padding: 32px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 32px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <main>
    <h1>control-app Dashboard</h1>
    <p id="status">Loading...</p>

    <h2>Licenses</h2>
    <table>
      <thead>
        <tr><th>Owner</th><th>Username</th><th>Token</th><th>Status</th><th>Devices</th><th>Expires</th><th>Last Seen</th></tr>
      </thead>
      <tbody id="licenses"></tbody>
    </table>

    <h2>Accounts</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Discord</th><th>Country</th><th>Alliance</th><th>Level</th><th>Pixels</th><th>Last Painted</th><th>Last URL</th></tr>
      </thead>
      <tbody id="accounts"></tbody>
    </table>

    <h2>Recent Events</h2>
    <table>
      <thead>
        <tr><th>Created</th><th>Event</th><th>Status</th><th>Account</th><th>IP</th><th>Country</th><th>City</th><th>URL</th></tr>
      </thead>
      <tbody id="events"></tbody>
    </table>
  </main>
  <script>
    /**
     * Returns a display-safe text value for table cells.
     * @param {unknown} value The source value.
     * @returns {string} The display value.
     */
    function displayValue(value) {
      if (value === null || value === undefined || value === '') {
        return '-';
      }
      return String(value);
    }

    /**
     * Appends a table row to a table body.
     * @param {HTMLElement} tbody The table body.
     * @param {unknown[]} values The row cell values.
     */
    function appendRow(tbody, values) {
      const tr = document.createElement('tr');
      for (const value of values) {
        const td = document.createElement('td');
        td.textContent = displayValue(value);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    /**
     * Loads dashboard data from the protected admin API.
     */
    async function loadDashboard() {
      const status = document.getElementById('status');
      const key = new URLSearchParams(window.location.search).get('key');

      if (!key) {
        status.textContent = 'Pass your admin key as ?key=...';
        status.className = 'error';
        return;
      }

      try {
        const response = await fetch('/api/admin/overview', {
          headers: { 'x-admin-key': key },
          cache: 'no-store'
        });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || 'Unable to load dashboard data.');
        }

        const licensesBody = document.getElementById('licenses');
        const accountsBody = document.getElementById('accounts');
        const eventsBody = document.getElementById('events');

        for (const license of payload.licenses || []) {
          appendRow(licensesBody, [
            license.owner_name,
            license.username,
            license.token_preview,
            license.status,
            `${displayValue(license.device_count)}/${displayValue(license.max_devices)}`,
            license.expires_at,
            license.last_seen_at
          ]);
        }

        for (const account of payload.accounts || []) {
          appendRow(accountsBody, [
            account.account_name,
            account.discord,
            account.country,
            account.alliance_name,
            account.level,
            account.pixels_painted,
            account.last_painted_at,
            account.last_url
          ]);
        }

        for (const event of payload.events || []) {
          appendRow(eventsBody, [
            event.created_at,
            event.event_type,
            event.status,
            event.account_name,
            event.ip_address,
            event.country,
            event.city,
            event.current_url
          ]);
        }

        status.textContent = 'Loaded.';
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Unable to load dashboard data.';
        status.className = 'error';
      }
    }

    void loadDashboard();
  </script>
</body>
</html>
